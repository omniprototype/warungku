<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Warung</title><meta name="theme-color" content="#c2410c">
<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 12px 90px}
h3{margin:16px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}.hd .g{flex:1}
.lg{width:44px;height:44px;border-radius:12px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}.lg img{width:100%;height:100%;object-fit:cover}
.card,.row{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px}.row.off{opacity:.5}.em{font-size:28px}.g{flex:1;min-width:0}.g small,small,.mu{color:var(--mu)}.g small{display:block}
button,select,input{font:inherit;color:var(--tx)}
button{border:1px solid var(--ln);background:var(--cd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;margin-top:8px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);margin:3px 0}
.st{display:flex;align-items:center;gap:8px}.st button{width:34px;padding:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--ln);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}.bar>div{max-width:640px;margin:0 auto}

.mc img,.mc .ph{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.mc .ph{display:flex;align-items:center;justify-content:center;font-size:52px;background:var(--ln)}

@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
body.pg #app{max-width:1000px}

.rcp{background:#fff;color:#000;width:280px;padding:14px;font:12px/1.4 ui-monospace,monospace}.rcp .l{display:flex;justify-content:space-between}.rcp hr{border:0;border-top:1px dashed #000}
@media print{body.rc #app,.noprint{display:none!important}#rcw{position:static;background:none;padding:0}}
</style></head><body><div id="app">Memuat…</div><div id="rcw" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const INIT={},APP_URL='';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),R=n=>'Rp'+Number(n||0).toLocaleString('id-ID'),today=t=>t&&new Date(t).toDateString()===new Date().toDateString();
const S={sel:{},joins:[],set:{},menu:[],orders:[],staff:[],cart:{},nm:'',tb:'',me:null,tab:'dapur',per:'hari',pay:null,rc:null,qt:'',url:APP_URL||location.href.split('#')[0].split('?')[0],ready:false,err:false};
const mem0={},store={g(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return mem0[k]??null},s(k,v){mem0[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
try{S.me=JSON.parse(store.g('me')||'null')}catch(e){}
/* ===== Koneksi ke Google Apps Script (database = Google Spreadsheet) ===== */
const API='https://script.google.com/macros/s/AKfycbziOsbSo9RIIP1-HzalNtqZcCT4SQp_IbOrUPLAdpCmIxAilmKnVggc2afaONV2J9Wo/exec';
const GS=typeof google!=='undefined'&&google.script&&google.script.run;
async function rpc(a){const q={...a,tok:store.g('tok')||''};let j;
 if(GS)j=await new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e&&e.message||e))).api(JSON.stringify(q)));
 else{const r=await fetch(API,{method:'POST',body:JSON.stringify(q),redirect:'follow'});j=await r.json()}
 if(j.err){if(j.err==='auth'){store.s('tok','');store.s('me','');S.me=null}throw new Error(j.err==='auth'?'Sesi habis atau tidak punya izin. Masuk staf lagi.':j.err)}return j}
function makeDb(){
 if(!GS&&(!API||API.startsWith('PASTE')))return null;
 const vers={},data={},subs={},emit=c=>(subs[c]||[]).forEach(f=>f());
 async function sync(){const j=await rpc({a:'sync',vers});for(const c in j.cols){vers[c]=j.cols[c].v;if(j.cols[c].docs){data[c]=j.cols[c].docs;emit(c)}}}
 const w=async(a,c,id,d)=>{const j=await rpc({a,c,id,d});await sync();return j};
 const snap=c=>({docs:(data[c]||[]).map(d=>({id:d.id,data:()=>{const{id,...r}=d;return r}}))});
 const loop=async()=>{if(!document.hidden){try{await sync()}catch(e){}}setTimeout(loop,/^#\/(staff|panggil)/.test(location.hash)||store.g('oid')?4000:12000)};
 return{init:async()=>{await sync();setTimeout(loop,4000)},
  collection:c=>({onSnapshot(cb){(subs[c]=subs[c]||[]).push(()=>cb(snap(c)));cb(snap(c))},add:d=>w('add',c,null,d)}),
  doc:p=>{const[c,id]=p.split('/');return{onSnapshot(cb){const f=()=>{const d=(data[c]||[]).find(x=>x.id===id);cb({exists:!!d,data:()=>{if(!d)return{};const{id:_,...r}=d;return r}})};(subs[c]=subs[c]||[]).push(f);f()},update:d=>w('update',c,id,d),set:d=>w('set',c,id,d),delete:()=>w('delete',c,id)}}}}
let db=null;
const QS=new URLSearchParams(location.search),P=k=>INIT[k]??QS.get(k);
if(P('staff'))location.hash='#/staff';else if(P('panggil'))location.hash='#/panggil';else if(P('ta'))location.hash='#/ta';else if(P('m'))location.hash='#/m/'+P('m');
const m0=location.hash.match(/^#\/m\/(.+)/);if(m0)S.tb=decodeURIComponent(m0[1]);S.tp=/^#\/ta/.test(location.hash)?'ta':'dine';
window.onerror=(m,u,l)=>{const a=document.getElementById('app');if(a)a.insertAdjacentHTML('afterbegin','<p style="color:#b91c1c">Error: '+m+' (baris '+l+')</p>')};
window.onunhandledrejection=e=>{const r=e.reason||{};alert('Gagal: '+(r.code?r.code+' - ':'')+(r.message||r))};
setTimeout(async()=>{try{db=makeDb();if(db)await db.init()}catch(e){db=null;S.why=String(e&&e.message||e)}
if(!db){S.err=true;return render()}
const sub=(c,k)=>db.collection(c).onSnapshot(sn=>{S[k]=sn.docs.map(d=>({id:d.id,...d.data()}));rr()});
sub('menu','menu');sub('orders','orders');sub('staff','staff');sub('joins','joins');
db.doc('settings/main').onSnapshot(d=>{S.set=d.exists?d.data():{};rr()});
S.ready=true;render();setInterval(rr,20000)},0);
function rr(){const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;render()}
const logo=l=>!l?'🍜':l.startsWith('data:')?`<img src="${l}" alt="">`:E(l);
let tp=[];function lgTap(){const n=Date.now();tp=tp.filter(t=>n-t<2500);tp.push(n);if(tp.length>=5){tp=[];location.hash='#/staff'}}
const head=()=>`<div class="hd"><div class="lg" onclick="lgTap()">${logo(S.set.logo)}</div><div class="g"><b style="font-size:18px">${E(S.set.name||'Warung Saya')}</b></div></div>`;
function render(){
 document.body.classList.toggle('rc',!!S.rc);document.title=S.set.name||'Warung';
 const st=location.hash.startsWith('#/staff'),pg=location.hash.startsWith('#/panggil');document.body.classList.toggle('pg',pg);let b;
 if(S.err)b='<p>Tidak bisa terhubung ke server (Apps Script). Periksa koneksi internet atau pengaturan alamat API di index.html.</p>'+(S.why?'<small>'+E(S.why)+'</small>':'');
 else if(!S.ready)b='Memuat…';else b=st?staff():pg?panggil():cust();
 const c0=$('.chips'),sl=c0?c0.scrollLeft:0;$('#app').innerHTML=head()+b;const c2=$('.chips');if(c2){c2.scrollLeft=sl;const k=c2.querySelector('.on');if(k){if(k.offsetLeft<c2.scrollLeft)c2.scrollLeft=k.offsetLeft-8;else if(k.offsetLeft+k.offsetWidth>c2.scrollLeft+c2.clientWidth)c2.scrollLeft=k.offsetLeft+k.offsetWidth-c2.clientWidth+8}}
 if(S.ready){if(pg)ann();else if(!st)notify()}
 const rw=$('#rcw');rw.hidden=!S.rc;rw.innerHTML=S.rc?receipt(S.rc):'';
 const q=$('#qr');if(q&&typeof QRCode!=='undefined'){q.innerHTML='';new QRCode(q,{text:S.url+(S.qta?'?ta=1':'?m='+encodeURIComponent(S.qt)),width:200,height:200})}
}
window.onhashchange=render;
/* ===== PEMBELI ===== */
function cust(){
 const my=S.orders.find(o=>o.id===store.g('oid'));if(my)return track(my);
 if(!S.menu.length)return '<p class="mu">Menu belum tersedia.</p>';
 const ta=S.tp==='ta',cats=[...new Set(S.menu.map(m=>m.cat||'Menu'))],n=Object.values(S.cart).reduce((a,b)=>a+b,0),t=S.menu.reduce((a,m)=>a+(S.cart[m.id]||0)*m.price,0);
 let h=`<div style="margin:2px 0 4px"><span class="tag">${ta?'🛍 Take away':S.tb?'🍽 Meja '+E(S.tb):'Scan QR di meja'}</span></div><div class="chips"><a href="#" class="${S.cat?'':'on'}" onclick="selCat(-1);return false">Semua</a>${cats.map((c,i)=>`<a href="#" class="${S.cat===c?'on':''}" onclick="selCat(${i});return false">${E(c)}</a>`).join('')}</div>`;
 (S.cat&&cats.includes(S.cat)?[S.cat]:cats).forEach(c=>{h+=`<h3>${E(c)}</h3><div class="grid">`+S.menu.filter(m=>(m.cat||'Menu')===c).map(m=>{const q=S.cart[m.id]||0;return `<div class="mc${m.off?' off':''}">${m.img?`<img src="${E(m.img)}" alt="">`:`<div class="ph">${E(m.emoji||'🍽️')}</div>`}<div class="mb"><b>${E(m.name)}</b><div class="pr">${R(m.price)}</div><small>⏱ ±${m.mins||10} mnt/porsi</small>${m.off?'<div class="hb">Habis</div>':q?`<div class="st"><button onclick="cq('${m.id}',-1)">−</button><b>${q}</b><button onclick="cq('${m.id}',1)">+</button></div>`:`<button class="add" onclick="cq('${m.id}',1)">+ Tambah</button>`}</div></div>`}).join('')+'</div>'});
 const top=S.tb?`<div class="tabs" style="margin:8px 0"><button class="${ta?'':'on'}" onclick="S.tp='dine';render()">🍽 Makan di sini · Meja ${E(S.tb)}</button><button class="${ta?'on':''}" onclick="S.tp='ta';render()">🛍 Bawa pulang</button></div>`:'',
 mid=(S.tb||ta)?`<input placeholder="Nama Anda (untuk dipanggil)" value="${E(S.nm)}" oninput="S.nm=this.value">`:'<p><b>Scan QR yang ada di meja Anda untuk memesan.</b></p>';
 const sheet=S.co&&n?`<div class="sh" onclick="if(event.target===this){S.co=0;render()}"><div class="sp"><b style="font-size:17px">Pesanan Anda</b>${S.menu.filter(m=>S.cart[m.id]).map(m=>`<div class="row" style="margin:6px 0"><div class="g"><b>${E(m.name)}</b><small>${R(m.price)}</small></div><div class="st"><button onclick="cq('${m.id}',-1)">−</button><b>${S.cart[m.id]}</b><button onclick="cq('${m.id}',1)">+</button></div></div>`).join('')}${top}${mid}<p>Total <b>${R(t)}</b><br><small>Estimasi siap ±${Math.ceil(sched({id:'_',at:Date.now(),items:S.menu.filter(m=>S.cart[m.id]).map(m=>({mins:m.mins||10,qty:S.cart[m.id]}))})['_']||0)} menit (termasuk antrian dapur)</small><br><small>Bayar setelah memesan: transfer/QRIS atau tunai di kasir.</small></p><button class="pri" onclick="order()">Pesan & bayar · ${R(t)}</button></div></div>`:'';
 const bar=n?`<div class="bar"><div><button class="pri" style="margin:0" onclick="S.co=1;render()">🛒 Lihat pesanan · ${n} item · ${R(t)}</button></div></div>`:'';
 return h+bar+sheet}
function selCat(i){S.cat=i<0?'':[...new Set(S.menu.map(m=>m.cat||'Menu'))][i];render();scrollTo(0,0)}
function cq(id,d){S.cart[id]=Math.max(0,(S.cart[id]||0)+d);if(!Object.values(S.cart).some(x=>x))S.co=0;render()}
async function order(){
 const items=S.menu.filter(m=>S.cart[m.id]).map(m=>({id:m.id,name:m.name,price:+m.price,qty:S.cart[m.id],mins:+m.mins||10}));
 const ta=S.tp==='ta',tb=ta?'':S.tb.trim();if(!ta&&!tb)return alert('Scan QR yang ada di meja Anda untuk memesan');if(!items.length)return alert('Pilih menu dulu');if(!S.nm.trim())return alert('Isi nama Anda');
 try{const r=await db.collection('orders').add({no:String(Date.now()).slice(-4),name:S.nm.trim(),table:tb,type:ta?'ta':'dine',items,total:items.reduce((a,i)=>a+i.price*i.qty,0),est:items.reduce((a,i)=>a+i.mins*i.qty,0),status:'bayar',paid:false,add:S.prev||'',at:Date.now()});store.s('oid',r.id);S.cart={};S.prev='';S.co=0;render()}catch(e){alert('Gagal mengirim pesanan, coba lagi')}}
function track(o){
 const i={bayar:0,verif:0,cek:0,baru:1,dimasak:2,selesai:3,diantar:3}[o.status]??0,ah=S.orders.filter(x=>x.status==='baru'&&x.at<o.at).length;let f='';
 if(o.status==='bayar'||o.status==='verif')f=(o.rej?'Pembayaran belum kami terima. ':'')+`Silakan bayar ${R(o.total)}: transfer/QRIS dari meja ini, atau tunai di kasir. Pesanan dibuat setelah pembayaran.`;if(o.status==='cek')f='Terima kasih! Kasir sedang memastikan pembayaran Anda…';
 if(o.status==='baru')f=`Pembayaran diterima ✅ Antrian ke-${ah+1} di dapur. Estimasi siap ±${Math.ceil(sched()[o.id]||eta(o))} menit.`;
 if(o.status==='dimasak'){const l=Math.ceil(sched()[o.id]??0);f=l>0?`Sedang dimasak, sisa ± ${l} menit.`:'Hampir selesai…'}
 if(o.status==='selesai')f=`🔔 Pesanan siap! Silakan ambil di counter. ${o.type==='ta'?'Nama Anda':'Nama & nomor meja Anda'} akan dipanggil lewat suara.`;
 if(o.status==='diantar')f='Pesanan sudah diambil. Selamat makan! 😋';
 if(o.status==='batal')f='Pesanan dibatalkan. Silakan hubungi kasir.';
 const lb=['📝 Dipesan','💳 Dibayar','🍳 Dimasak','🔔 Siap'];
 return `<div class="card"><b>Pesanan #${o.no}</b>${o.add?' ➕ tambahan':''} · ${E(o.name)}${o.type==='ta'?' · 🛍 Take away':' · Meja '+E(o.table)}<div class="steps">${lb.map((s,k)=>`<div class="${k<=i?'on':''}"><i>${s.split(' ')[0]}</i>${s.split(' ')[1]}</div>`).join('')}</div><p><b>${f}</b></p>${o.items.map(x=>`<div>${x.qty}× ${E(x.name)}</div>`).join('')}<p>Total <b>${R(o.total)}</b> · ${o.paid?'<span style="color:var(--ok)">Sudah dibayar</span>':'Belum dibayar'}</p></div>${o.status==='bayar'||o.status==='verif'?payCard(o):''}<button class="pri" onclick="S.prev='${o.no}';store.s('oid','');render()">+ Tambah pesanan</button>`}
/* ===== SUARA ===== */
const sp={on:false,seen:{}};
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('id'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const callTxt=o=>`Pesanan ${o.add?'tambahan ':''}atas nama ${o.name}, ${o.type==='ta'?'bawa pulang':'meja '+o.table}, sudah siap. Silakan diambil di counter.`;
function ann(){if(!sp.on)return;S.orders.filter(o=>o.status==='selesai').sort((a,b)=>a.ce-b.ce).forEach(o=>{const k=o.ce+':'+(o.calls||0);if(sp.seen[o.id]!==k){sp.seen[o.id]=k;say(callTxt(o));say(callTxt(o))}})}
function spOn(){sp.on=true;S.orders.filter(o=>o.status==='selesai').forEach(o=>sp.seen[o.id]=o.ce+':'+(o.calls||0));say('Suara pengumuman aktif');render()}
function notify(){const o=S.orders.find(x=>x.id===store.g('oid'));if(o&&o.status==='selesai'&&store.g('said')!==o.id+o.ce){store.s('said',o.id+o.ce);say(`Pesanan atas nama ${o.name} sudah siap. Silakan diambil di counter.`);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
function panggil(){
 const rd=S.orders.filter(o=>o.status==='selesai').sort((a,b)=>a.ce-b.ce),pr=S.orders.filter(o=>o.status==='baru'||o.status==='dimasak').sort((a,b)=>a.at-b.at);
 return `${sp.on?'<small>🔊 Suara aktif</small>':'<button class="pri" onclick="spOn()">🔊 Aktifkan suara pengumuman</button>'}<h3>Siap diambil</h3>${rd.map(o=>`<div class="card" style="font-size:26px"><b>${E(o.name)}</b> · ${o.type==='ta'?'🛍 Take away':'Meja '+E(o.table)} <small>#${o.no}</small></div>`).join('')||'<p class="mu">Belum ada.</p>'}<h3>Sedang diproses</h3><div>${pr.map(o=>`<span class="chip ${o.status}" style="font-size:18px;margin:3px">${E(o.name)}</span>`).join(' ')||'<small>Tidak ada.</small>'}</div>`}
/* ===== STAF ===== */
function staff(){
 if(!S.me)return `<div class="card"><b>Masuk staf</b> <a class="mu" href="#/" style="float:right">← Menu</a><select id="ls"><option value="_o">Pemilik</option>${S.staff.map(s=>`<option value="${s.id}">${E(s.name)} (${s.role})</option>`).join('')}</select><input id="lp" type="password" inputmode="numeric" placeholder="PIN">${S.set.hasPin?'':'<small>PIN awal pemilik: 1234 (ganti di Pengaturan)</small>'}<button class="pri" onclick="login()">Masuk</button></div>`;

async function saveS(){await db.doc('settings/main').set({name:$('#sn').value.trim(),logo:S.lg??$('#sl').value.trim(),pin:$('#sp').value.trim(),rek:$('#sr').value.trim(),koki:+$('#sk').value||2,qris:S.qr??S.set.qris??''});S.lg=undefined;S.qr=undefined;alert('Tersimpan')}
async function addS(){const n=$('#s_n').value.trim(),p=$('#s_p').value.trim();if(!n||!p)return alert('Isi nama & PIN');await db.collection('staff').add({name:n,role:$('#s_r').value,pin:p});render()}
function qr(){return `<div class="card" style="text-align:center"><b>${S.qta?'QR Take Away (taruh di kasir)':'QR Meja '+E(S.qt)}</b><div id="qr" style="display:flex;justify-content:center;margin:10px"></div><small>Link menu: ${E(S.url)}${S.qta?'?ta=1':'?m='+E(S.qt)}</small><br><small>Link staf: ${E(S.url)}?staff=1<br>Layar panggil: ${E(S.url)}?panggil=1</small><div class="noprint"><div class="tabs"><button class="${S.qta?'':'on'}" onclick="S.qta=0;render()">QR Meja</button><button class="${S.qta?'on':''}" onclick="S.qta=1;render()">QR Take Away</button></div><input placeholder="No. meja (kosongkan untuk umum)" value="${E(S.qt)}" onchange="S.qt=this.value;render()"><input placeholder="Alamat link aplikasi" value="${E(S.url)}" onchange="S.url=this.value;render()"><button class="pri" onclick="window.print()">🖨 Cetak QR</button></div></div>`}
</script></body></html>
